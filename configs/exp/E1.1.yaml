# E1.1 — один нейрон, линейная регрессия, диагностика проблем обучения.
# Покрывает задание 1 лабораторной 1.
#
# Параметры здесь взяты из методички дословно (§1.4): малая скорость обучения,
# десять эпох, размер пакета во всю выборку. Смысл конфига именно в том, чтобы
# воспроизвести плохую сходимость, а не обойти её.
name: single_neuron_linreg_baseline

data:
  name: lab1_linreg
  normalize: false

model:
  name: mlp
  hidden: []          # пустой список -> один линейный слой -> один нейрон

train:
  epochs: 10
  batch_size: 12      # весь датасет за один шаг: один градиент на эпоху
  lr: 0.01
  optimizer: rmsprop
  loss: mse
  metric: rmse
  metric_mode: min

seed: 0

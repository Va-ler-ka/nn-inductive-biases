[project]
name = "nnlab"
version = "0.1.0"
description = "Индуктивные смещения нейросетевых архитектур: единый каркас курсовой работы"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nnlab*"]

[tool.ruff]
line-length = 100
target-version = "py310"
